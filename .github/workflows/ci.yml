name: PeakForm Athletics CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Lint, Typecheck & Vitest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The repo is managed with bun (bun.lock is the committed lockfile).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: npx eslint . --max-warnings=0

      - name: TypeScript Type Check
        run: npx tsc -b

      - name: Run Vitest Test Suite
        run: npm test

      - name: Build Production Bundle
        run: npm run build
        env:
          VITE_LOCAL_DEV: "false"
          VITE_CONVEX_URL: "https://peakform-production.convex.cloud"
